<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quack</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
/* glassmorphism: translucent blurred panels floating over a soft color wall */
:root {
  color-scheme: light dark;
  --wall: radial-gradient(at 10% 15%, #c5d9ff 0, transparent 50%), radial-gradient(at 90% 8%, #e2d8ff 0, transparent 45%),
          radial-gradient(at 75% 95%, #bde8ff 0, transparent 50%), #eef3fb;
  --glass: rgb(255 255 255 / .45); --glass-hi: rgb(255 255 255 / .72); --hover: rgb(255 255 255 / .6); --line: rgb(255 255 255 / .75);
  --text: #16203a; --muted: #5d6781; --accent: #3b82f6; --on-accent: #ffffff;
  --todo: #8a93a8; --doing: #3b82f6; --done: #22b07d; --high: #ef5b5b; --mid: #f29a4a; --low: #8a93a8;
  --shadow: 0 8px 32px rgb(30 60 120 / .12); --blur: blur(22px) saturate(160%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --wall: radial-gradient(at 10% 15%, #1e3a8a 0, transparent 50%), radial-gradient(at 90% 8%, #4c1d95 0, transparent 45%),
            radial-gradient(at 75% 95%, #0e7490 0, transparent 50%), #0b1020;
    --glass: rgb(255 255 255 / .06); --glass-hi: rgb(255 255 255 / .1); --hover: rgb(255 255 255 / .14); --line: rgb(255 255 255 / .12);
    --text: #eef2ff; --muted: #9aa5c4; --accent: #60a5fa; --on-accent: #0b1020;
    --shadow: 0 8px 32px rgb(0 0 0 / .35);
  }
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body {
  margin: 0; display: grid; grid-template-columns: 248px 1fr; gap: 12px; padding: 12px;
  font: 14px/1.5 "Wanted Sans Variable", "Wanted Sans", system-ui, sans-serif;
  background: var(--wall) fixed; color: var(--text); -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer; border: 1px solid transparent; border-radius: 999px; padding: 6px 14px; background: transparent; transition: background .15s }
button:hover { background: var(--hover) }
button.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 40%, transparent) }
button.primary:hover { filter: brightness(1.08) }
.muted { color: var(--muted) }
.pad { padding: 4px 10px; margin: 0 }

/* shared glass panel */
#side, section, #page, dialog {
  background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
}

/* sidebar */
#side { border-radius: 20px; padding: 14px 8px; overflow-y: auto; height: calc(100vh - 24px); position: sticky; top: 12px }
.brand { font-weight: 700; font-size: 15px; padding: 2px 10px 12px; display: flex; align-items: center; gap: 8px }
.brand .mascot { margin: -4px 0 }
.hey { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 8px }
.hey p { margin: 6px 0 0 }
.mascot { display: inline-block; vertical-align: middle; overflow: visible }
.hey .mascot { animation: bob 2.4s ease-in-out infinite }
@keyframes bob { 50% { transform: translateY(-4px) rotate(-2deg) } }
@media (prefers-reduced-motion: reduce) { .hey .mascot { animation: none } }
#q { width: 100%; border: 1px solid var(--line); background: var(--glass-hi); border-radius: 999px; padding: 7px 14px; margin-bottom: 10px; outline: none }
#q:focus { border-color: var(--accent) }
#side a { display: block; padding: 6px 12px; border-radius: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#side a:hover { background: var(--hover) }
#side a.on { background: var(--glass-hi); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line) }
.sec { display: flex; align-items: center; justify-content: space-between; padding: 16px 4px 4px 12px; font-size: 12px; font-weight: 600; color: var(--muted) }
.sec button { padding: 0 8px; font-size: 16px; line-height: 22px; color: var(--muted) }
#tree ul { list-style: none; margin: 0; padding-left: 12px }
#tree > ul { padding-left: 0 }
#results a small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis }
.tag { font-size: 11px; color: var(--muted); margin-right: 6px; font-family: ui-monospace, Consolas, monospace }

/* main */
main { min-width: 0; padding: 16px 24px }
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; min-height: 34px }
.top h1 { font-size: 24px; margin: 0 auto 0 0 }

/* board */
#cols { display: grid; grid-template-columns: repeat(3, minmax(240px, 1fr)); gap: 16px; overflow-x: auto }
section { border-radius: 20px; padding: 12px; min-height: 70vh; transition: outline-color .1s; outline: 2px dashed transparent; outline-offset: -2px }
section.over { outline-color: var(--accent) }
section h2 { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 2px 4px 12px }
.count { color: var(--muted); font-weight: 400 }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none }
.s-todo { background: var(--todo) } .s-doing { background: var(--doing) } .s-done { background: var(--done) }
.card { background: var(--glass-hi); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: grab; transition: transform .15s, box-shadow .15s }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow) }
.card .title { font-weight: 500; word-break: break-word }
.meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted) }
.key { font-family: ui-monospace, Consolas, monospace }
.prio { display: inline-flex; align-items: center; gap: 5px }
.prio::before { content: ""; width: 7px; height: 7px; border-radius: 50% }
.p-high::before { background: var(--high) } .p-mid::before { background: var(--mid) } .p-low::before { background: var(--low) }

/* docs */
#empty { padding-top: 22vh }
#page { max-width: 860px; margin: 0 auto; border-radius: 24px; padding: 24px 40px 40px }
#crumb { color: var(--muted); font-size: 13px; margin-right: auto; display: flex; gap: 6px; flex-wrap: wrap }
#crumb a:hover { color: var(--text) }
#vTitle { font-size: 34px; line-height: 1.25; margin: 8px 0 20px; word-break: break-word }
#pTitle { width: 100%; font-size: 34px; font-weight: 700; border: 0; outline: none; background: transparent; padding: 0; margin: 8px 0 16px }
#pBody { width: 100%; min-height: 60vh; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--glass-hi); outline: none; resize: vertical; font: 14px/1.7 ui-monospace, Consolas, monospace }
#pBody:focus { border-color: var(--accent) }
.row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 12px }
.row .muted { margin-right: auto; font-size: 12px }

/* rendered markdown */
.md { font-size: 15px; line-height: 1.75; word-break: break-word }
.md h1, .md h2, .md h3 { line-height: 1.3; margin: 1.6em 0 .5em }
.md h1 { font-size: 26px } .md h2 { font-size: 21px } .md h3 { font-size: 17px }
.md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px }
.md code { font-family: ui-monospace, Consolas, monospace; font-size: .88em; background: var(--hover); padding: .15em .4em; border-radius: 6px }
.md pre { background: var(--glass-hi); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; overflow-x: auto }
.md pre code { background: none; padding: 0 }
.md blockquote { margin: 1em 0; padding: 2px 16px; border-left: 3px solid var(--accent); color: var(--muted) }
.md table { border-collapse: collapse } .md th, .md td { border: 1px solid var(--line); padding: 6px 10px }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0 }
.md img { max-width: 100%; border-radius: 12px }

/* issue dialog */
dialog { border-radius: 24px; padding: 24px; color: var(--text); width: min(560px, 92vw); background: var(--glass-hi) }
dialog::backdrop { background: rgb(10 15 30 / .25); backdrop-filter: blur(4px) }
dialog form { display: grid; gap: 12px }
#dlgKey { font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace }
dialog input[name=title] { font-size: 20px; font-weight: 700; border: 0; outline: none; background: transparent; padding: 0 }
dialog textarea { min-height: 160px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--glass); outline: none; resize: vertical }
dialog textarea:focus { border-color: var(--accent) }
#iPreview { min-height: 160px; max-height: 45vh; overflow-y: auto }
.fields { display: flex; gap: 8px }
.fields select { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--glass) }
#del { color: var(--high); margin-right: auto }
</style>
</head>
<body>

<aside id="side">
  <div class="brand"><span id="logo"></span>Quack</div>
  <input id="q" type="search" placeholder="검색  ( / )" autocomplete="off">
  <div id="results" hidden></div>
  <div id="treeWrap">
    <a href="#board" id="navBoard">보드</a>
    <div class="sec"><span>문서</span><button id="newPage" title="새 문서">+</button></div>
    <div id="tree"></div>
  </div>
</aside>

<main>
  <div id="board">
    <div class="top"><h1>보드</h1><button class="primary" id="newIssue">새 이슈</button></div>
    <div id="cols"></div>
  </div>

  <div id="docs" hidden>
    <div id="empty"></div>
    <article id="page" hidden>
      <div class="top">
        <span id="crumb"></span>
        <button id="pEdit">편집</button>
        <button id="pChild">하위 페이지</button>
        <button id="pDel">삭제</button>
      </div>
      <div id="view">
        <h1 id="vTitle"></h1>
        <div id="vBody" class="md"></div>
      </div>
      <div id="edit" hidden>
        <input id="pTitle" placeholder="제목 없음">
        <textarea id="pBody" placeholder="마크다운으로 작성하세요"></textarea>
        <div class="row">
          <span class="muted">Ctrl+S 저장 · Esc 취소</span>
          <button id="pCancel">취소</button>
          <button class="primary" id="pSave">저장</button>
        </div>
      </div>
    </article>
  </div>
</main>

<dialog id="dlg">
  <form method="dialog">
    <span id="dlgKey"></span>
    <input name="title" placeholder="이슈 제목" required autocomplete="off">
    <div><button type="button" id="iPreviewToggle" aria-pressed="false" aria-controls="iPreview">미리보기</button></div>
    <textarea id="iBody" name="body" placeholder="설명 (마크다운)"></textarea>
    <div id="iPreview" class="md" hidden></div>
    <div class="fields"><select name="status"></select><select name="prio"></select></div>
    <div class="row">
      <button type="button" id="del">삭제</button>
      <button value="cancel" formnovalidate>취소</button>
      <button value="save" class="primary">저장</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>
<script>
// Mascot: round duck-lipped little guy with a tuft. Moods: idle, proud, shock, cry.
function mascot(mood = 'idle', size = 96) {
  const open = mood === 'shock' || mood === 'cry';
  const eyes = {
    idle: '<circle cx="48" cy="50" r="4.5"/><circle cx="72" cy="50" r="4.5"/>',
    proud: '<path d="M42 52q6-7 12 0M66 52q6-7 12 0" fill="none" stroke-width="3.5" stroke-linecap="round"/>',
    shock: '<circle cx="48" cy="47" r="8.5" fill="#fff" stroke-width="3"/><circle cx="72" cy="47" r="8.5" fill="#fff" stroke-width="3"/>'
         + '<circle cx="48" cy="48" r="2.6"/><circle cx="72" cy="48" r="2.6"/>',
    cry: '<path d="M41 47l12 5M79 47l-12 5" fill="none" stroke-width="3.5" stroke-linecap="round"/>'
       + '<path d="M45 56q-4 12 0 22M75 56q4 12 0 22" fill="none" stroke="#6ec6ff" stroke-width="5" stroke-linecap="round"/>',
  }[mood];
  const lips = open
    ? '<ellipse cx="60" cy="63" rx="21" ry="7" fill="#ff8a3d"/><ellipse cx="60" cy="71" rx="11" ry="6" fill="#5a1e1e"/>'
      + '<ellipse cx="60" cy="79" rx="16" ry="6" fill="#ff7a2d"/>'
    : `<g transform="rotate(${mood === 'proud' ? -9 : 0} 60 68)"><ellipse cx="60" cy="65" rx="22" ry="8" fill="#ff8a3d"/>`
      + '<ellipse cx="60" cy="74" rx="16" ry="7" fill="#ff7a2d"/></g>';
  const sparkle = mood === 'proud'
    ? '<path d="M98 14l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffd23f" stroke-width="2"/>' : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="${size}" height="${size}" class="mascot"
    stroke="#2b2320" stroke-width="3" stroke-linejoin="round" fill="#2b2320">
    <ellipse cx="48" cy="114" rx="9" ry="4" fill="#ff8a3d"/><ellipse cx="72" cy="114" rx="9" ry="4" fill="#ff8a3d"/>
    <ellipse cx="60" cy="98" rx="25" ry="16" fill="#3b4aa8"/>
    <ellipse cx="34" cy="96" rx="6" ry="9" fill="#fff6e0" transform="rotate(25 34 96)"/>
    <ellipse cx="86" cy="96" rx="6" ry="9" fill="#fff6e0" transform="rotate(-25 86 96)"/>
    <path d="M54 24Q48 6 60 3Q55 13 62 21Q66 6 79 8Q67 13 66 24Z" fill="#ffd23f"/>
    <circle cx="60" cy="56" r="34" fill="#fff6e0"/>
    <ellipse cx="36" cy="62" rx="6" ry="3.5" fill="#ffb3b3" stroke="none"/><ellipse cx="84" cy="62" rx="6" ry="3.5" fill="#ffb3b3" stroke="none"/>
    ${eyes}${lips}${sparkle}</svg>`;
}

// mood + line shown where a list is empty
const hey = (mood, line, size = 72) => `<div class="hey">${mascot(mood, size)}<p>${line}</p></div>`;

const COLS = { todo: '할 일', doing: '진행 중', done: '완료' };
const EMPTY_COL = {
  todo: hey('proud', '할 일이 없다!<br>역시 나야!'),
  doing: hey('idle', '지금은 아무것도<br>안 하는 중…'),
  done: hey('cry', '아직 끝낸 게<br>하나도 없어… 흑'),
};
const PRIO = { high: '높음', mid: '보통', low: '낮음' };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const F = $('dlg').querySelector('form').elements;
const options = o => Object.entries(o).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
F.prio.innerHTML = options(PRIO);
F.status.innerHTML = options(COLS);
marked.use({ breaks: true });
$('logo').innerHTML = mascot('idle', 26);
$('empty').innerHTML = hey('idle', '문서를 골라라!<br>아니면 <b>+</b> 로 새로 만들든가!', 140);
document.head.insertAdjacentHTML('beforeend',
  `<link rel="icon" href="data:image/svg+xml,${encodeURIComponent(mascot('idle'))}">`);

let editing = null;     // issue open in the dialog
let page = null;        // page open in the docs view
let pages = [];         // all pages, for the tree and breadcrumbs
let current = 'board';  // hash of the active view, for sidebar highlight
let routed = '';        // location.hash of the view on screen, restored when leaving an unsaved edit is cancelled
let editNext = false;   // open the next routed page straight in edit mode

async function api(path, opts = {}) {
  const r = await fetch('/api/' + path, {
    ...opts, headers: { 'Content-Type': 'application/json' }, body: opts.body && JSON.stringify(opts.body),
  });
  if (!r.ok) { alert(`서버 오류 ${r.status}`); throw new Error(r.status) }
  const text = await r.text();
  return text ? JSON.parse(text) : null;
}

// ---- sidebar ----

async function renderTree() {
  pages = await api('items?kind=page');
  const tree = parent => {
    const kids = pages.filter(p => p.parent_id === parent);
    return kids.length ? `<ul>${kids.map(p =>
      `<li><a href="#docs/${p.id}">${esc(p.title)}</a>${tree(p.id)}</li>`).join('')}</ul>` : '';
  };
  $('tree').innerHTML = tree(null) || '<p class="muted pad">아직 문서가 없어요</p>';
  for (const a of $('side').querySelectorAll('a')) a.classList.toggle('on', a.getAttribute('href') === '#' + current);
}

let searchTimer;
$('q').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 200) };

async function search() {
  const q = $('q').value.trim();
  $('results').hidden = !q;
  $('treeWrap').hidden = !!q;
  if (!q) return;
  const hits = await api('search?q=' + encodeURIComponent(q));
  $('results').innerHTML = hits.map(h => `<a href="#${h.kind === 'issue' ? 'issue' : 'docs'}/${h.id}">
      <span class="tag">${h.kind === 'issue' ? 'QK-' + h.id : '문서'}</span>${esc(h.title)}
      <small>${esc(h.snippet.slice(0, 80))}</small></a>`).join('') || hey('shock', '꽥?! 없는데…?<br>다른 말로 찾아봐!');
}

// ---- board ----

async function renderBoard() {
  const issues = await api('items?kind=issue');
  $('cols').innerHTML = '';
  for (const [st, name] of Object.entries(COLS)) {
    const list = issues.filter(i => i.status === st);
    const sec = document.createElement('section');
    sec.innerHTML = `<h2><i class="dot s-${st}"></i>${name}<span class="count">${list.length}</span></h2>`;
    sec.ondragover = e => { e.preventDefault(); sec.classList.add('over') };
    sec.ondragleave = e => { if (!sec.contains(e.relatedTarget)) sec.classList.remove('over') };
    sec.ondrop = async e => {
      await api(`items/${e.dataTransfer.getData('text/plain')}`, { method: 'PATCH', body: { status: st } });
      renderBoard();
    };
    for (const i of list) {
      const c = document.createElement('div');
      c.className = 'card';
      c.draggable = true;
      c.innerHTML = `<div class="title">${esc(i.title)}</div>
        <div class="meta"><span class="key">QK-${i.id}</span><span class="prio p-${i.prio}">${PRIO[i.prio]}</span></div>`;
      c.ondragstart = e => e.dataTransfer.setData('text/plain', i.id);
      c.onclick = async () => edit(await api('items/' + i.id));
      sec.append(c);
    }
    if (!list.length) sec.insertAdjacentHTML('beforeend', EMPTY_COL[st]);
    $('cols').append(sec);
  }
}

function edit(i) {
  editing = i;
  $('dlgKey').textContent = i ? `QK-${i.id}` : '새 이슈';
  F.title.value = i?.title ?? '';
  F.body.value = i?.body ?? '';
  F.body.hidden = false;
  $('iPreview').hidden = true;
  $('iPreview').replaceChildren();
  $('iPreviewToggle').textContent = '미리보기';
  $('iPreviewToggle').setAttribute('aria-pressed', 'false');
  F.prio.value = i?.prio ?? 'mid';
  F.status.value = i?.status ?? 'todo';
  $('del').hidden = !i;
  $('dlg').showModal();
}

$('iPreviewToggle').onclick = () => {
  const preview = $('iPreview').hidden;
  if (preview) $('iPreview').innerHTML = F.body.value.trim()
    ? DOMPurify.sanitize(marked.parse(F.body.value))
    : '<p class="muted">설명이 비어 있어요.</p>';
  F.body.hidden = preview;
  $('iPreview').hidden = !preview;
  $('iPreviewToggle').textContent = preview ? '작성' : '미리보기';
  $('iPreviewToggle').setAttribute('aria-pressed', String(preview));
};

$('dlg').querySelector('form').onsubmit = async e => {
  if (e.submitter?.value !== 'save') return;
  const body = { title: F.title.value.trim(), body: F.body.value, prio: F.prio.value, status: F.status.value };
  await (editing ? api('items/' + editing.id, { method: 'PATCH', body })
                 : api('items', { method: 'POST', body: { kind: 'issue', ...body } }));
  renderBoard();
};

$('del').onclick = async () => {
  if (!confirm(`QK-${editing.id} 삭제할까요?`)) return;
  $('dlg').close();
  await api('items/' + editing.id, { method: 'DELETE' });
  renderBoard();
};

// ---- docs ----

function linkIssues(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: node => node.parentElement.closest('a, code, pre, script, style, textarea')
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const matches = [...node.textContent.matchAll(/\bQK-(\d+)\b/g)];
    if (!matches.length) continue;
    const fragment = document.createDocumentFragment();
    let start = 0;
    for (const match of matches) {
      fragment.append(node.textContent.slice(start, match.index));
      const link = document.createElement('a');
      link.href = '#issue/' + match[1];
      link.className = 'key';
      link.textContent = match[0];
      fragment.append(link);
      start = match.index + match[0].length;
    }
    fragment.append(node.textContent.slice(start));
    node.replaceWith(fragment);
  }
}

async function renderDoc(id, startEdit) {
  $('empty').hidden = !!id;
  $('page').hidden = !id;
  if (!id) return;
  page = await api('items/' + id);
  const trail = [];
  for (let p = page; p; p = pages.find(x => x.id === p.parent_id)) trail.unshift(p);
  $('crumb').innerHTML = trail.map(p => `<a href="#docs/${p.id}">${esc(p.title)}</a>`).join('<span>/</span>');
  showView();
  if (startEdit) showEdit();
}

function showView() {
  $('vTitle').textContent = page.title;
  $('vBody').innerHTML = page.body.trim()
    ? DOMPurify.sanitize(marked.parse(page.body))
    : '<p class="muted">비어 있는 문서예요. 편집을 눌러 작성해 보세요.</p>';
  linkIssues($('vBody'));
  $('view').hidden = false;
  $('edit').hidden = true;
  $('pEdit').hidden = false;
}

function showEdit() {
  $('pTitle').value = page.title;
  $('pBody').value = page.body;
  $('view').hidden = true;
  $('edit').hidden = false;
  $('pEdit').hidden = true;
  $('pBody').focus();
}

const isEditing = () => !$('docs').hidden && !$('edit').hidden;
const isDirty = () => isEditing() && ($('pTitle').value !== page.title || $('pBody').value !== page.body);
const confirmDiscard = () => !isDirty() || confirm('저장하지 않은 변경이 있어요. 버릴까요?');

function cancelEdit() {
  if (!confirmDiscard()) return;
  showView();
}

async function savePage() {
  await api('items/' + page.id, { method: 'PATCH', body: { title: $('pTitle').value.trim() || '제목 없음', body: $('pBody').value } });
  await renderTree();
  renderDoc(page.id);
}

async function newPage(parent_id = null) {
  if (!confirmDiscard()) return;  // ask before the POST, or a cancel leaves an orphan page
  if (isEditing()) showView();    // already confirmed: don't ask again on hashchange
  const p = await api('items', { method: 'POST', body: { kind: 'page', title: '제목 없음', parent_id } });
  editNext = true;
  location.hash = `docs/${p.id}`;
}

$('vBody').ondblclick = showEdit;
$('pEdit').onclick = showEdit;
$('pCancel').onclick = cancelEdit;
$('pSave').onclick = savePage;
$('pChild').onclick = () => newPage(page.id);
$('newPage').onclick = () => newPage();
$('newIssue').onclick = () => edit(null);
$('pDel').onclick = async () => {
  if (!confirm('이 페이지와 하위 페이지를 모두 삭제할까요?')) return;
  if (isEditing()) showView();  // the edit goes with the page: don't also ask to discard it
  await api('items/' + page.id, { method: 'DELETE' });
  location.hash = 'docs';
};

// ---- routing & keys ----

async function route() {
  let [view, id] = location.hash.slice(1).split('/');
  if (view === 'issue') {  // search hit on an issue: show the board with it open
    history.replaceState(null, '', '#board');
    view = 'board';
    api('items/' + id).then(edit);
  }
  routed = location.hash || '#board';
  const docs = view === 'docs';
  current = docs && id ? `docs/${id}` : docs ? 'docs' : 'board';
  $('board').hidden = docs;
  $('docs').hidden = !docs;
  await renderTree();
  if (docs) { renderDoc(+id || null, editNext); editNext = false }
  else renderBoard();
}

document.onkeydown = e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && isEditing()) { e.preventDefault(); savePage() }
  else if (e.key === 'Escape' && e.target === $('q')) { $('q').value = ''; search(); $('q').blur() }
  else if (e.key === 'Escape' && isEditing() && !$('dlg').open) { e.preventDefault(); cancelEdit() }
  else if (typing || $('dlg').open) return;
  else if (e.key === '/') { e.preventDefault(); $('q').focus() }
  else if (e.key === 'n') { e.preventDefault(); $('docs').hidden ? edit(null) : newPage() }
};

onbeforeunload = e => { if (isDirty()) e.preventDefault() };
// Sidebar, search and breadcrumb links all change the hash; route() would re-render and drop the edit.
// replaceState puts the old hash back without firing another hashchange.
onhashchange = () => {
  if (!confirmDiscard()) return history.replaceState(null, '', routed);
  route();
};
route();
</script>
</body>
</html>
