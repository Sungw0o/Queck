# Codex project config. Codex reads AGENTS.md by itself; this adds the Quack MCP server and the shared guard hook.
# Claude Code equivalents: .mcp.json (same URL) and .claude/settings.json (same scripts/guard.mjs). Keep them in step.
# Codex loads this file only after you trust the project (it asks the first time you open this folder).
[features]
hooks = true

[mcp_servers.quack]
url = "http://localhost:8765/mcp"

# Read-only tools run without asking; all writes retain the default approval policy.
[mcp_servers.quack.tools.search]
approval_mode = "approve"

[mcp_servers.quack.tools.get]
approval_mode = "approve"

[mcp_servers.quack.tools.wiki_context]
approval_mode = "approve"

[mcp_servers.quack.tools.history]
approval_mode = "approve"

# External accounts. Notion uses OAuth (`codex mcp login notion`); GitHub reads a PAT from GITHUB_PAT. Never put tokens in this file.
# GitLab joins later as url = "https://<host>/api/v4/mcp". Same servers as .mcp.json.
[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT"
